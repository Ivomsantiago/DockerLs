name: DockerLs security gate
on: [pull_request]
permissions:
  contents: read
jobs:
  dockerls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: dockerls analyze "$IMAGE" --ci --fail-on critical > dockerls-result.json
        env:
          IMAGE: ghcr.io/example/app:${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dockerls-security
          path: dockerls-result.json
