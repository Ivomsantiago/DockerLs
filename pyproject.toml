[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerls"
version = "1.0.5"
description = "Enterprise Docker Image Security Advisor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ivomsantiago"},
]
keywords = ["docker", "security", "vulnerability", "scanner", "devops", "devsecops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    # Transitive (httpx -> httpcore/anyio), floored rather than left to the
    # resolver: `pip-audit` is a gate in this project's own CI, and idna
    # below 3.15 carries PYSEC-2026-215. Nothing here imports idna directly.
    "idna>=3.15",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-PyYAML>=6.0",
    # Testing only. `jsonschema` validates the SARIF exporter's output
    # against the vendored OASIS SARIF 2.1.0 schema (draft-04), and
    # `hypothesis` fuzzes the reference and Dockerfile parsers -- the two
    # places where a hostile string has repeatedly turned into a wrong
    # security verdict. Neither is imported by `dockerls/`.
    "jsonschema>=4.0",
    "hypothesis>=6.100",
]

[project.scripts]
dockerls = "dockerls.cli.app:main"

[project.urls]
Homepage = "https://github.com/Ivomsantiago/DockerLs"
Repository = "https://github.com/Ivomsantiago/DockerLs"
Issues = "https://github.com/Ivomsantiago/DockerLs/issues"

[tool.setuptools.packages.find]
include = ["dockerls*"]

# The hardened Dockerfile templates are data files, not modules, so
# `packages.find` alone never put them in the wheel: `dockerls build
# --hardened` worked from a source checkout and failed from an install.
[tool.setuptools.package-data]
dockerls = ["infrastructure/templates/hardening/*.dockerfile"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# typer requires calling Option()/Argument() as parameter defaults --
# that's the framework's documented usage pattern, not a real footgun.
"dockerls/cli/commands/**" = ["B008"]

# Pydantic BaseModel needs its field annotations resolvable at class
# definition time, so imports used only in model field types must stay
# as real (non-TYPE_CHECKING-guarded) imports.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.11"
strict = true
# Without this, every `class X(BaseModel)` is "cannot subclass ... has type
# Any" -- 13 of the 20 errors that `strict = true` was silently tolerating.
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["dockerls"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
