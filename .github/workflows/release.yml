name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the tag matches pyproject.toml's version
        run: make check-version
      - run: pip install build
      - run: python -m build

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Signed artifacts (.sigstore bundles) and the provenance
          # attestation are attached alongside the built distributions so
          # consumers can verify `cosign verify-blob` / `gh attestation verify`.
          files: |
            dist/*
