name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the tag matches pyproject.toml's version
        run: make check-version
      - run: pip install build
      - run: python -m build

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      - name: Move Sigstore bundles out of dist/
        # The signing step above writes each *.sigstore.json next to the
        # wheel/sdist it signs, inside dist/. gh-action-pypi-publish takes
        # every file in packages-dir as a distribution to upload, so a
        # signature bundle left in dist/ makes it fail with
        # "InvalidDistribution: Unknown distribution format" before it ever
        # gets to the real packages. The bundles still get attached to the
        # GitHub Release below, just from their own directory.
        run: |
          mkdir -p signatures
          mv dist/*.sigstore.json signatures/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Extract this version's CHANGELOG.md section for the release body
        # CHANGELOG.md already carries the narrative for every release --
        # `generate_release_notes` alone only produces a PR list, with none
        # of it. This pulls the text between this version's `## [x.y.z]`
        # heading and the next `## [` heading (whichever comes first: the
        # next version, or a section like `[1.0.0-internal]` further down)
        # into a file, so the GitHub Release body carries the same story a
        # human reading CHANGELOG.md would see, and generate_release_notes
        # still appends the auto-generated PR list after it.
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for ${GITHUB_REF_NAME#v}; falling back to auto-generated notes only." >&2
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          # Signed artifacts (.sigstore bundles) and the provenance
          # attestation are attached alongside the built distributions so
          # consumers can verify `cosign verify-blob` / `gh attestation verify`.
          files: |
            dist/*
            signatures/*
